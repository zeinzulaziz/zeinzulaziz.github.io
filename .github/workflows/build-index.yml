name: Build posts index

on:
  push:
    paths:
      - "content/posts/**"
      - "tools/build-index.mjs"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/build-index.mjs
      - name: Commit updated index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/posts.json
          git diff --staged --quiet || git commit -m "chore: regenerate posts.json"
          git push
