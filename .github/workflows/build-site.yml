name: Build site

on:
  push:
    branches: [main]
    paths:
      - "content/posts/**"
      - "tools/**"
  # Daily refresh keeps content/repos.json (GitHub snapshot) from going stale
  # even when nothing is pushed.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Snapshot GitHub repos
        run: node tools/build-repos.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build manifest, pages, sitemap, feed
        run: node tools/build.mjs
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/posts.json content/repos.json post sitemap.xml feed.xml
          git diff --staged --quiet || git commit -m "chore: rebuild site artifacts"
          git push
